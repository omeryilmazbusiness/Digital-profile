openapi: 3.0.3
info:
  title: Sheraton Makkah Digital Sales Experience API
  version: 0.1.0
  description: |
    Single source of truth for the HTTP contract between the Go backend and the
    Next.js frontend. Server stubs and the typed client are generated from this file.

    All error responses use RFC 9457 `application/problem+json`.
  license:
    name: Proprietary
    url: https://github.com/omeryilmazbusiness/Digital-profile
servers:
  - url: /
    description: Same origin — the reverse proxy routes API paths to the backend
tags:
  - name: system
    description: Operational endpoints (liveness / readiness probes)

paths:
  /healthz:
    get:
      tags: [system]
      operationId: getLiveness
      summary: Liveness probe
      description: Reports whether the process is running. Never checks dependencies.
      security: []
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"
        default:
          $ref: "#/components/responses/Problem"

  /readyz:
    get:
      tags: [system]
      operationId: getReadiness
      summary: Readiness probe
      description: Reports whether the service can accept traffic. Runs every registered dependency check.
      security: []
      responses:
        "200":
          description: All dependency checks passed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"
        "503":
          description: At least one dependency check failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"
        default:
          $ref: "#/components/responses/Problem"

components:
  responses:
    Problem:
      description: Error response (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    HealthStatus:
      type: string
      enum: [up, down]

    HealthReport:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
        version:
          type: string
          description: Build version of the running binary
          example: 0.1.0
        checks:
          type: array
          items:
            $ref: "#/components/schemas/HealthCheck"

    HealthCheck:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name:
          type: string
          example: database
        status:
          $ref: "#/components/schemas/HealthStatus"
        error:
          type: string
          description: Failure reason; present only when status is `down`

    Problem:
      type: object
      description: RFC 9457 Problem Details
      required: [type, title, status]
      properties:
        type:
          type: string
          description: URI reference identifying the problem type
          example: about:blank
        title:
          type: string
          example: Not Found
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          example: 404
        detail:
          type: string
        instance:
          type: string
        requestId:
          type: string
          description: Correlates the response with server logs
        errors:
          type: array
          description: Field-level validation errors
          items:
            $ref: "#/components/schemas/FieldError"

    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
          example: checkOut
        message:
          type: string
          example: must be after checkIn
