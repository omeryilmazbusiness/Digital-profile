openapi: 3.0.3
info:
  title: Sheraton Makkah Digital Sales Experience API
  version: 0.1.0
  description: |
    Single source of truth for the HTTP contract between the Go backend and the
    Next.js frontend. Server stubs and the typed client are generated from this file.

    All error responses use RFC 9457 `application/problem+json`.

    ## Authentication
    Operations are protected by default (global `cookieAuth`); public operations opt out
    explicitly. Login sets two `HttpOnly; SameSite=Strict` cookies: a short-lived access token
    (`dp_access`, `__Host-dp_access` over HTTPS) and a rotating refresh token (`dp_refresh`,
    `__Secure-dp_refresh` over HTTPS) scoped to `/api/v1/auth`. Browsers send them automatically;
    clients never handle tokens.

    ## CSRF
    State-changing requests (`POST`, `PUT`, `PATCH`, `DELETE`) under `/api/v1/auth` and
    `/api/v1/admin` must send `X-CSRF-Protection: 1`, and their `Origin`, when present, must be
    the site origin. Otherwise the API answers `403`.
  license:
    name: Proprietary
    url: https://github.com/omeryilmazbusiness/Digital-profile
servers:
  - url: /
    description: Same origin — the reverse proxy routes API paths to the backend
security:
  - cookieAuth: []
tags:
  - name: system
    description: Operational endpoints (liveness / readiness probes)
  - name: auth
    description: Admin session management
  - name: media
    description: Image library (admin) and immutable image delivery (public)
  - name: profile
    description: The sales manager's digital business card and its vCard
  - name: discover
    description: Topics of the Discover section and their PDF brochures
  - name: settings
    description: Site-wide settings such as the virtual tour link
  - name: site
    description: Everything the public site shows, in one request

paths:
  /healthz:
    get:
      tags: [system]
      operationId: getLiveness
      summary: Liveness probe
      description: Reports whether the process is running. Never checks dependencies.
      security: []
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"
        default:
          $ref: "#/components/responses/Problem"

  /readyz:
    get:
      tags: [system]
      operationId: getReadiness
      summary: Readiness probe
      description: Reports whether the service can accept traffic. Runs every registered dependency check.
      security: []
      responses:
        "200":
          description: All dependency checks passed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"
        "503":
          description: At least one dependency check failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in
      description: |
        Verifies the credentials and starts a session. The response never reveals whether the
        email exists or the account is temporarily locked after repeated failures.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in; session cookies are set
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookies"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Rotate the session tokens
      description: |
        Exchanges the refresh cookie for a new access and refresh token. Each refresh token
        works once; presenting a used one again revokes every session of the account.
        `409` means a concurrent request already rotated the token: retry the original
        request with the cookies it set.
      security: []
      responses:
        "200":
          description: Tokens rotated; session cookies are set
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookies"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Sign out
      description: Revokes the current session and clears the cookies. Idempotent.
      security: []
      responses:
        "204":
          description: Signed out; session cookies are cleared
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookies"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentAdmin
      summary: Current admin
      responses:
        "200":
          description: The signed-in admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/auth/password:
    put:
      tags: [auth]
      operationId: changePassword
      summary: Change password
      description: |
        Changes the password, signs out every other session and starts a fresh one for the
        caller (new cookies are set).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed; new session cookies are set
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookies"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/admin/media:
    get:
      tags: [media]
      operationId: listMedia
      summary: List images
      description: Newest first. Pass `nextCursor` from the previous page as `cursor`.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 128
            pattern: "^[A-Za-z0-9_-]+$"
      responses:
        "200":
          description: A page of images
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [media]
      operationId: uploadMedia
      summary: Upload an image
      description: |
        Accepts JPEG, PNG or WebP, identified from the file content rather than its name.
        The original is not stored: responsive WebP variants (480, 960 and 1600 px wide, never
        upscaled) are rendered with EXIF orientation applied and all metadata except the colour
        profile removed. Uploading the same file again returns the existing image with `200`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
            encoding:
              file:
                contentType: image/jpeg, image/png, image/webp
      responses:
        "200":
          description: The same file was uploaded before; the existing image is returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Media"
        "201":
          description: Image stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Media"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/admin/media/{mediaId}:
    parameters:
      - $ref: "#/components/parameters/MediaId"
    get:
      tags: [media]
      operationId: getMedia
      summary: Get an image
      responses:
        "200":
          description: The image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Media"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [media]
      operationId: deleteMedia
      summary: Delete an image
      description: Fails with `409` while the image is used by any content.
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/admin/media/{mediaId}/alt-text:
    parameters:
      - $ref: "#/components/parameters/MediaId"
    put:
      tags: [media]
      operationId: updateMediaAltText
      summary: Replace the alternative text
      description: Sets the alt text per language; languages left out are cleared.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalizedAltText"
      responses:
        "200":
          description: Updated image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Media"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/public/media/{file}:
    get:
      tags: [media]
      operationId: getPublicMedia
      summary: Image variant
      description: |
        Serves a variant by its content-hash file name. The bytes behind a name never change,
        so responses are cacheable forever (`immutable`).
      security: []
      parameters:
        - name: file
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{64}\\.webp$"
        - name: If-None-Match
          in: header
          schema:
            type: string
            maxLength: 1024
      responses:
        "200":
          description: The image
          headers:
            Cache-Control:
              schema:
                type: string
              example: public, max-age=31536000, immutable
            ETag:
              schema:
                type: string
          content:
            image/webp:
              schema:
                type: string
                format: binary
        "304":
          description: The client copy is current
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/admin/profile:
    get:
      tags: [profile]
      operationId: getProfile
      summary: Get the profile
      description: "`404` until the profile is saved for the first time."
      responses:
        "200":
          description: The profile, with what is still missing before it can be published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    put:
      tags: [profile]
      operationId: updateProfile
      summary: Replace the profile
      description: |
        Full replacement: optional fields left out are cleared, and so are languages missing
        from `translations`. Phone numbers are accepted in international notation
        (`+966 12 545 6789`, `00966…`) and stored in E.164.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: The saved profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/public/profile:
    get:
      tags: [profile]
      operationId: getPublicProfile
      summary: The published business card
      description: |
        Texts are in the requested language, falling back to English, Indonesian, then Arabic;
        `locale` tells which one was used. `404` while the profile is incomplete, so visitors
        see a placeholder instead of half-filled contact details.
      security: []
      parameters:
        - $ref: "#/components/parameters/LocaleQuery"
      responses:
        "200":
          description: The business card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProfile"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/public/profile/vcard:
    get:
      tags: [profile]
      operationId: getProfileVCard
      summary: Download the contact card
      description: |
        vCard 3.0 (UTF-8, CRLF, folded lines) with the contact card photo (the portrait unless
        another image is chosen) embedded as a JPEG, which both iOS Contacts and Google Contacts
        import. Same availability as the public profile.
      security: []
      parameters:
        - $ref: "#/components/parameters/LocaleQuery"
      responses:
        "200":
          description: The contact card
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="Momen-Hassan.vcf"
          content:
            text/vcard:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/public/profile/business-card:
    get:
      tags: [profile]
      operationId: getProfileBusinessCard
      summary: Download the business card image
      description: |
        The uploaded business card as a JPEG (at most 1600 px wide, transparency on white), saved
        under the profile's name. `404` until the profile is published with a business card.
        The `ETag` follows the image, so a new card is fetched as soon as it is chosen.
      security: []
      parameters:
        - $ref: "#/components/parameters/LocaleQuery"
        - name: If-None-Match
          in: header
          schema:
            type: string
            maxLength: 1024
      responses:
        "200":
          description: The business card
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="Momen-Hassan-business-card.jpg"
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "304":
          description: The client copy is current
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/admin/discover/sections:
    get:
      tags: [discover]
      operationId: listDiscoverSections
      summary: List the topics with their documents
      description: In display order; documents within a topic too.
      responses:
        "200":
          description: All topics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverSectionList"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [discover]
      operationId: createDiscoverSection
      summary: Add a topic
      description: The new topic goes last. A title in at least one language is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscoverSectionInput"
      responses:
        "201":
          description: Topic created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverSection"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/admin/discover/section-order:
    put:
      tags: [discover]
      operationId: reorderDiscoverSections
      summary: Reorder the topics
      description: "`ids` must list every topic exactly once, in the new order."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SectionOrder"
      responses:
        "200":
          description: All topics in the new order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverSectionList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/admin/discover/sections/{sectionId}:
    parameters:
      - $ref: "#/components/parameters/SectionId"
    put:
      tags: [discover]
      operationId: updateDiscoverSection
      summary: Replace a topic's texts
      description: Languages missing from `translations` are removed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscoverSectionInput"
      responses:
        "200":
          description: The saved topic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverSection"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [discover]
      operationId: deleteDiscoverSection
      summary: Delete a topic and its documents
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/admin/discover/sections/{sectionId}/documents:
    parameters:
      - $ref: "#/components/parameters/SectionId"
    post:
      tags: [discover]
      operationId: uploadDocument
      summary: Add a PDF to a topic
      description: |
        `metadata` (JSON, `DocumentInput`) describes the file; `file` is the PDF, identified from
        its content rather than its name. The document goes last within the topic.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [metadata, file]
              properties:
                metadata:
                  $ref: "#/components/schemas/DocumentInput"
                file:
                  type: string
                  format: binary
            encoding:
              metadata:
                contentType: application/json
              file:
                contentType: application/pdf
      responses:
        "201":
          description: Document stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/admin/documents/{documentId}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    put:
      tags: [discover]
      operationId: updateDocument
      summary: Replace a document's titles and language
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "200":
          description: The saved document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [discover]
      operationId: deleteDocument
      summary: Delete a document
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/admin/documents/{documentId}/file:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    put:
      tags: [discover]
      operationId: replaceDocumentFile
      summary: Upload a new version of the PDF
      description: Titles, language and position stay; the public link keeps working.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
            encoding:
              file:
                contentType: application/pdf
      responses:
        "200":
          description: The updated document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/public/documents/{documentId}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      tags: [discover]
      operationId: getPublicDocument
      summary: The PDF
      description: |
        Opens in the browser's viewer, or is saved under its file name with `download=true`.
        The `ETag` is the file's SHA-256, so a new version is fetched as soon as it is uploaded.
      security: []
      parameters:
        - name: download
          in: query
          schema:
            type: boolean
            default: false
        - name: If-None-Match
          in: header
          schema:
            type: string
            maxLength: 1024
      responses:
        "200":
          description: The PDF
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
                example: inline; filename="Groups-and-Umrah.pdf"
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "304":
          description: The client copy is current
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/admin/settings:
    get:
      tags: [settings]
      operationId: getSettings
      summary: Get the site settings
      description: Defaults until saved for the first time.
      responses:
        "200":
          description: The settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    put:
      tags: [settings]
      operationId: updateSettings
      summary: Replace the site settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsInput"
      responses:
        "200":
          description: The saved settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/public/site:
    get:
      tags: [site]
      operationId: getPublicSite
      summary: Everything the public site shows
      description: |
        The published profile (absent until complete), the Discover topics with their documents
        and the virtual tour link (absent until set), in the requested language with the same
        fallback as the profile. Topics and documents without any text are left out.
      security: []
      parameters:
        - $ref: "#/components/parameters/LocaleQuery"
      responses:
        "200":
          description: The site content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSite"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"

components:
  parameters:
    LocaleQuery:
      name: locale
      in: query
      description: Preferred interface language
      schema:
        $ref: "#/components/schemas/Locale"

    MediaId:
      name: mediaId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    SectionId:
      name: sectionId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: dp_access
      description: Access token cookie (`__Host-dp_access` when served over HTTPS)

  headers:
    SessionCookies:
      description: Access and refresh token cookies (HttpOnly, SameSite=Strict)
      schema:
        type: string

  responses:
    Problem:
      description: Error response (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    HealthStatus:
      type: string
      enum: [up, down]

    HealthReport:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
        version:
          type: string
          description: Build version of the running binary
          example: 0.1.0
        checks:
          type: array
          items:
            $ref: "#/components/schemas/HealthCheck"

    HealthCheck:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name:
          type: string
          example: database
        status:
          $ref: "#/components/schemas/HealthStatus"
        error:
          type: string
          description: Failure reason; present only when status is `down`

    Problem:
      type: object
      description: RFC 9457 Problem Details
      required: [type, title, status]
      properties:
        type:
          type: string
          description: URI reference identifying the problem type
          example: about:blank
        title:
          type: string
          example: Not Found
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          example: 404
        detail:
          type: string
        instance:
          type: string
        requestId:
          type: string
          description: Correlates the response with server logs
        errors:
          type: array
          description: Field-level validation errors
          items:
            $ref: "#/components/schemas/FieldError"

    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
          example: checkOut
        message:
          type: string
          example: must be after checkIn

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: momen@example.com
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 1024

    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
        newPassword:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          description: 12–128 characters, different from the current password and the email

    AdminUser:
      type: object
      additionalProperties: false
      required: [id, email, passwordChangedAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        lastLoginAt:
          type: string
          format: date-time
        passwordChangedAt:
          type: string
          format: date-time

    SessionInfo:
      type: object
      additionalProperties: false
      required: [accessTokenExpiresAt]
      properties:
        accessTokenExpiresAt:
          type: string
          format: date-time
          description: When to refresh; the access cookie stops being sent after this instant

    LoginResponse:
      type: object
      additionalProperties: false
      required: [admin, accessTokenExpiresAt]
      properties:
        admin:
          $ref: "#/components/schemas/AdminUser"
        accessTokenExpiresAt:
          type: string
          format: date-time

    LocalizedAltText:
      type: object
      additionalProperties: false
      description: Alternative text per interface language
      properties:
        en:
          $ref: "#/components/schemas/AltText"
        id:
          $ref: "#/components/schemas/AltText"
        ar:
          $ref: "#/components/schemas/AltText"

    AltText:
      type: string
      minLength: 1
      maxLength: 300

    ImageVariant:
      type: object
      additionalProperties: false
      required: [width, height, url, byteSize]
      properties:
        width:
          type: integer
          format: int32
        height:
          type: integer
          format: int32
        url:
          type: string
          description: Immutable URL; relative to the API origin unless a CDN base is configured
          example: /api/v1/public/media/9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08.webp
        byteSize:
          type: integer
          format: int64

    Media:
      type: object
      additionalProperties: false
      required: [id, width, height, sourceType, sourceBytes, originalFilename, placeholder, altText, variants, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        width:
          type: integer
          format: int32
          description: Display width after EXIF orientation
        height:
          type: integer
          format: int32
        sourceType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        sourceBytes:
          type: integer
          format: int64
        originalFilename:
          type: string
        placeholder:
          type: string
          description: Tiny blurred WebP data URI to show while the image loads
        altText:
          $ref: "#/components/schemas/LocalizedAltText"
        variants:
          type: array
          description: Ascending by width; use as `srcset`
          minItems: 1
          items:
            $ref: "#/components/schemas/ImageVariant"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MediaPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Media"
        nextCursor:
          type: string
          description: Present when more images exist

    Locale:
      type: string
      enum: [en, id, ar]
      description: Interface language

    SpokenLanguage:
      type: string
      description: ISO 639-1 code of a language the sales manager speaks
      enum: [ar, en, tr, id, ms, ur, fa, fr, de, es, it, nl, pt, ru, zh, ja, ko, hi, bn, ta, ml, th, tl, ha, so, sw, am, az, kk, uz, ky, tg, ps, sq, bs, ku, yo, wo]

    ProfileTranslation:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
          example: Director of Sales
        tagline:
          type: string
          maxLength: 160
          description: One-line slogan under the name
        bio:
          type: string
          maxLength: 1000
        whatsappMessage:
          type: string
          maxLength: 500
          description: Text pre-filled in WhatsApp when a visitor starts a chat
        displayName:
          type: string
          maxLength: 120
          description: The full name as written in this language; defaults to first and last name
          example: مؤمن توفيق الكسواني
        address:
          $ref: "#/components/schemas/Address"

    Address:
      type: object
      additionalProperties: false
      description: Office address as written in one language
      properties:
        street:
          type: string
          maxLength: 200
          example: Ibrahim Al Khalil Street
        city:
          type: string
          maxLength: 80
          example: Makkah
        country:
          type: string
          maxLength: 80
          example: Saudi Arabia

    LocalizedProfileText:
      type: object
      additionalProperties: false
      description: Texts per interface language; at least one language is needed to publish
      properties:
        en:
          $ref: "#/components/schemas/ProfileTranslation"
        id:
          $ref: "#/components/schemas/ProfileTranslation"
        ar:
          $ref: "#/components/schemas/ProfileTranslation"

    ProfileInput:
      type: object
      additionalProperties: false
      required: [firstName, translations]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 60
        lastName:
          type: string
          maxLength: 60
        organization:
          type: string
          maxLength: 120
          example: Sheraton Makkah Jabal Al Kaaba Hotel
        portraitMediaId:
          type: string
          format: uuid
          description: An image from the media library
        vcardPhotoMediaId:
          type: string
          format: uuid
          description: Image saved with the downloaded contact card; the portrait when left out
        businessCardMediaId:
          type: string
          format: uuid
          description: The designed business card visitors save as an image
        phone:
          type: string
          maxLength: 32
          example: "+966 12 545 6789"
        whatsapp:
          type: string
          maxLength: 32
        email:
          type: string
          maxLength: 254
        languages:
          type: array
          description: Spoken languages in display order; defaults to Arabic, English, Turkish
          maxItems: 20
          uniqueItems: true
          items:
            $ref: "#/components/schemas/SpokenLanguage"
        postalCode:
          type: string
          maxLength: 20
          example: "24231"
        mapUrl:
          type: string
          maxLength: 500
          description: https link to the office on a map
        linkedinUrl:
          type: string
          maxLength: 500
          description: https link to a linkedin.com page
        translations:
          $ref: "#/components/schemas/LocalizedProfileText"

    Profile:
      type: object
      additionalProperties: false
      required: [firstName, lastName, fullName, organization, languages, translations, complete, missing, updatedAt]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        fullName:
          type: string
        organization:
          type: string
        portrait:
          $ref: "#/components/schemas/Media"
        vcardPhoto:
          $ref: "#/components/schemas/Media"
        businessCard:
          $ref: "#/components/schemas/Media"
        phone:
          type: string
          description: E.164
          example: "+966125456789"
        whatsapp:
          type: string
          description: E.164
        email:
          type: string
        languages:
          type: array
          items:
            $ref: "#/components/schemas/SpokenLanguage"
        postalCode:
          type: string
        mapUrl:
          type: string
        linkedinUrl:
          type: string
        translations:
          $ref: "#/components/schemas/LocalizedProfileText"
        complete:
          type: boolean
          description: Whether the public card and vCard are published
        missing:
          type: array
          description: What must be added before the profile is published
          items:
            type: string
            enum: [title, contact]
        updatedAt:
          type: string
          format: date-time

    PhoneNumber:
      type: object
      additionalProperties: false
      required: [e164, display]
      properties:
        e164:
          type: string
          example: "+966125456789"
        display:
          type: string
          description: International format for reading; render it left-to-right
          example: "+966 12 545 6789"

    WhatsAppContact:
      type: object
      additionalProperties: false
      required: [e164, display, url]
      properties:
        e164:
          type: string
        display:
          type: string
        url:
          type: string
          description: Opens a chat, with the localized greeting pre-filled when one is set
          example: https://wa.me/966125456789?text=Hello

    PublicImage:
      type: object
      additionalProperties: false
      required: [width, height, placeholder, variants]
      properties:
        width:
          type: integer
          format: int32
        height:
          type: integer
          format: int32
        placeholder:
          type: string
        alt:
          type: string
          description: Alternative text in the response language, when set
        variants:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ImageVariant"

    PublicProfile:
      type: object
      additionalProperties: false
      required: [locale, firstName, lastName, fullName, displayName, organization, title, languages]
      properties:
        locale:
          $ref: "#/components/schemas/Locale"
        firstName:
          type: string
        lastName:
          type: string
        fullName:
          type: string
        displayName:
          type: string
          description: The name as written in the response language
        organization:
          type: string
        title:
          type: string
        tagline:
          type: string
        bio:
          type: string
        portrait:
          $ref: "#/components/schemas/PublicImage"
        phone:
          $ref: "#/components/schemas/PhoneNumber"
        whatsapp:
          $ref: "#/components/schemas/WhatsAppContact"
        email:
          type: string
        languages:
          type: array
          items:
            $ref: "#/components/schemas/SpokenLanguage"
        address:
          $ref: "#/components/schemas/PublicAddress"
        mapUrl:
          type: string
        linkedinUrl:
          type: string
        businessCardUrl:
          type: string
          description: Downloads the business card as a JPEG; present when one is uploaded
          example: /api/v1/public/profile/business-card?locale=en

    PublicAddress:
      type: object
      additionalProperties: false
      required: [street, city, postalCode, country]
      properties:
        street:
          type: string
        city:
          type: string
        postalCode:
          type: string
        country:
          type: string

    DiscoverSectionText:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        eyebrow:
          type: string
          maxLength: 60
          description: Short label above the title
          example: Groups & Umrah
        title:
          type: string
          minLength: 1
          maxLength: 160
        body:
          type: string
          maxLength: 3000
          description: Plain text; blank lines separate paragraphs

    LocalizedDiscoverSectionText:
      type: object
      additionalProperties: false
      properties:
        en:
          $ref: "#/components/schemas/DiscoverSectionText"
        id:
          $ref: "#/components/schemas/DiscoverSectionText"
        ar:
          $ref: "#/components/schemas/DiscoverSectionText"

    DiscoverSectionInput:
      type: object
      additionalProperties: false
      required: [translations]
      properties:
        translations:
          $ref: "#/components/schemas/LocalizedDiscoverSectionText"

    DiscoverSection:
      type: object
      additionalProperties: false
      required: [id, position, translations, documents, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
          format: int32
        translations:
          $ref: "#/components/schemas/LocalizedDiscoverSectionText"
        documents:
          type: array
          items:
            $ref: "#/components/schemas/Document"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DiscoverSectionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DiscoverSection"

    SectionOrder:
      type: object
      additionalProperties: false
      required: [ids]
      properties:
        ids:
          type: array
          maxItems: 200
          uniqueItems: true
          items:
            type: string
            format: uuid

    DocumentText:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
          example: Groups and Umrah programmes

    LocalizedDocumentText:
      type: object
      additionalProperties: false
      properties:
        en:
          $ref: "#/components/schemas/DocumentText"
        id:
          $ref: "#/components/schemas/DocumentText"
        ar:
          $ref: "#/components/schemas/DocumentText"

    DocumentInput:
      type: object
      additionalProperties: false
      required: [language, translations]
      properties:
        language:
          $ref: "#/components/schemas/Locale"
        translations:
          $ref: "#/components/schemas/LocalizedDocumentText"

    Document:
      type: object
      additionalProperties: false
      required: [id, sectionId, language, fileName, byteSize, translations, url, downloadUrl, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        sectionId:
          type: string
          format: uuid
        language:
          $ref: "#/components/schemas/Locale"
        fileName:
          type: string
          example: Groups-and-Umrah.pdf
        byteSize:
          type: integer
          format: int64
        pageCount:
          type: integer
          format: int32
          description: Absent when it cannot be read from the file
        translations:
          $ref: "#/components/schemas/LocalizedDocumentText"
        url:
          type: string
          description: Opens the PDF in the browser; relative to the API origin
          example: /api/v1/public/documents/0b0c6c1e-6b8e-4c2e-9d1a-2d9f8c3b7a10
        downloadUrl:
          type: string
          description: Saves the PDF under `fileName`
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SettingsInput:
      type: object
      additionalProperties: false
      properties:
        tourUrl:
          type: string
          maxLength: 500
          description: https link to the 360° virtual tour; the tour section is hidden without it

    Settings:
      type: object
      additionalProperties: false
      required: [updatedAt]
      properties:
        tourUrl:
          type: string
        updatedAt:
          type: string
          format: date-time
          description: Zero time until saved for the first time

    PublicDocument:
      type: object
      additionalProperties: false
      required: [id, title, language, fileName, byteSize, url, downloadUrl, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        language:
          $ref: "#/components/schemas/Locale"
        fileName:
          type: string
        byteSize:
          type: integer
          format: int64
        pageCount:
          type: integer
          format: int32
        url:
          type: string
        downloadUrl:
          type: string
        updatedAt:
          type: string
          format: date-time

    PublicDiscoverSection:
      type: object
      additionalProperties: false
      required: [id, eyebrow, title, body, documents]
      properties:
        id:
          type: string
          format: uuid
        eyebrow:
          type: string
        title:
          type: string
        body:
          type: string
        documents:
          type: array
          items:
            $ref: "#/components/schemas/PublicDocument"

    PublicTour:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string

    PublicSite:
      type: object
      additionalProperties: false
      required: [locale, sections]
      properties:
        locale:
          $ref: "#/components/schemas/Locale"
        profile:
          $ref: "#/components/schemas/PublicProfile"
        sections:
          type: array
          items:
            $ref: "#/components/schemas/PublicDiscoverSection"
        tour:
          $ref: "#/components/schemas/PublicTour"
