# Type-safe query code generation. Run via `make generate`.
# Schema is read from the golang-migrate files (down migrations are ignored).
# Each bounded context adds its own entry with the same go options:
# queries in internal/modules/<name>/queries, output in internal/modules/<name>/store.
version: "2"

overrides:
  go:
    overrides:
      - db_type: uuid
        go_type: github.com/google/uuid.UUID
      - db_type: uuid
        nullable: true
        go_type:
          import: github.com/google/uuid
          type: UUID
          pointer: true
      - db_type: timestamptz
        go_type: time.Time
      - db_type: timestamptz
        nullable: true
        go_type:
          import: time
          type: Time
          pointer: true
      - db_type: inet
        go_type: net/netip.Addr
      - db_type: inet
        nullable: true
        go_type:
          import: net/netip
          type: Addr
          pointer: true
      - db_type: citext
        go_type: string
      - db_type: citext
        nullable: true
        go_type:
          type: string
          pointer: true

sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: dbgen
        out: internal/platform/database/dbgen
        sql_package: pgx/v5
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        output_db_file_name: db.gen.go
        output_models_file_name: models.gen.go
        output_querier_file_name: querier.gen.go
        output_files_suffix: .gen

  - engine: postgresql
    schema: db/migrations
    queries: internal/modules/auth/queries
    gen:
      go:
        package: store
        out: internal/modules/auth/store
        sql_package: pgx/v5
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        output_db_file_name: db.gen.go
        output_models_file_name: models.gen.go
        output_querier_file_name: querier.gen.go
        output_files_suffix: .gen
